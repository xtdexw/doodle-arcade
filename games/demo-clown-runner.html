// ---------- audio ----------
let AC=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return AC;
}
function beep(f,d,type,vol){
  const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||"square";o.frequency.value=f;
  g.gain.setValueAtTime(vol||.08,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+d);
}

// ---------- state ----------
let state="intro",t=0,last=0;
let speed,distance,score,combo,best,shield;
let noseClicks=0,noseTimer=0,wiggle=0,egg=false;
let player,obstacles,stars,particles,clouds;
let shake=0,flashStar=false;
best=parseInt(localStorage.getItem("clownRunnerBest")||"0",10)||0;

function resetPlayer(){
  return{x:250,y:GROUND,vy:0,w:54,h:92,onGround:true,jumps:0,
    sliding:false,slideT:0,run:0,dead:false};
}
function newGame(){
  speed=340;distance=0;score=0;combo=0;shield=egg?1:0;
  player=resetPlayer();
  obstacles=[];stars=[];particles=[];
  clouds=[];
  for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:60+Math.random()*180,s:.2+Math.random()*.5});
  state="play";
}
function start(){newGame();}
function stop(){state="off";}
function getScore(){return Math.floor(score);}

// ---------- input ----------
const keys={};
window.addEventListener("keydown",e=>{
  if(["Space","ArrowUp","ArrowDown"].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  ac();
  if(state==="intro"){return;}
  if(state==="over"){
    if(e.code==="Space"||e.code==="ArrowUp"){egg=false;noseClicks=0;newGame();}
    return;
  }
  if(e.code==="Space"||e.code==="ArrowUp")jump();
  if(e.code==="ArrowDown")slide(1);
});
window.addEventListener("keyup",e=>{
  if(e.code==="ArrowDown")slide(0);
});
cv.addEventListener("touchstart",e=>{
  e.preventDefault();ac();
  const r=cv.getBoundingClientRect();
  for(const tch of e.changedTouches){
    const x=(tch.clientX-r.left)*(W/r.width);
    const y=(tch.clientY-r.top)*(H/r.height);
    handleTap(x,y);
  }
},{passive:false});
cv.addEventListener("mousedown",e=>{
  const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)*(W/r.width),y=(e.clientY-r.top)*(H/r.height);
  ac();handleTap(x,y);
});
function handleTap(x,y){
  if(state==="intro"){
    // nose hotspot on the title clown (drawn around 400,250 r=26)
    if(Math.hypot(x-400,y-250)<34){
      noseClicks++;noseTimer=1.2;wiggle=.6;
      beep(700,.1,"square",.08);
      for(let i=0;i<6;i++)particles.push(mkNote(400+(Math.random()-.5)*30,250));
      if(noseClicks>=3){egg=true;shield=1;beep(1000,.25,"triangle",.1);}
    }
    return;
  }
  if(state==="over"){
    if(x>270&&x<530&&y>380&&y<450){egg=false;noseClicks=0;newGame();}
    return;
  }
  if(y<H*0.55)jump();else slide(1);
}
cv.addEventListener("touchend",e=>{e.preventDefault();slide(0);},{passive:false});

function jump(){
  if(state!=="play")return;
  if(player.jumps<2){
    player.vy=player.jumps===0?-640:-560;
    player.onGround=false;player.jumps++;
    player.sliding=false;
    beep(440+player.jumps*120,.12,"square",.07);
    for(let i=0;i<5;i++)particles.push({
      type:"dust",x:player.x,y:GROUND,vx:-60-Math.random()*60,
      vy:-Math.random()*40,life:.5,max:.5,c:C.cream});
  }
}
function slide(on){
  if(state!=="play")return;
  if(on){
    player.sliding=true;player.slideT=0.6;
    if(!player.onGround){player.vy=Math.max(player.vy,0);player.y=GROUND;player.onGround=true;}
  }else player.sliding=false;
}

// ---------- spawn ----------
function spawnObstacle(){
  const diff=Math.min(1,distance/2600);
  const rolling=Math.random()<0.35;
  const r=26+Math.random()*8;
  obstacles.push({type:"button",x:W+60,y:GROUND-r,r:r,
    rolling:rolling,rot:0,passed:false});
  // late game combo obstacle
  if(diff>0.55&&Math.random()<0.35){
    obstacles.push({type:"note",x:W+60+150+Math.random()*80,
      baseY:GROUND-118,phase:Math.random()*6.28,amp:14,w:44,h:56,passed:false});
  }else if(Math.random()<0.4){
    obstacles.push({type:"note",x:W+60+260+Math.random()*200,
      baseY:GROUND-118,phase:Math.random()*6.28,amp:14,w:44,h:56,passed:false});
  }
}
function spawnStar(){
  const high=Math.random()<0.5;
  stars.push({x:W+40,y:high?GROUND-150-Math.random()*60:GROUND-70,
    r:15,phase:Math.random()*6.28,taken:false});
}

// ---------- particles ----------
function mkNote(x,y){
  return{type:"note",x,y,vx:-40-Math.random()*40,vy:-80-Math.random()*60,
    life:1.4,max:1.4,c:PINK,rot:(Math.random()-.5)*.5};
}
function burstStars(x,y){
  for(let i=0;i<26;i++){
    const a=Math.random()*6.28,s=120+Math.random()*260;
    particles.push({type:"star",x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,
      life:1.2,max:1.2,c:PINK,rot:Math.random()*6.28,vr:(Math.random()-.5)*8,size:8+Math.random()*8});
  }
}

// ---------- update ----------
let spawnTO=0,starTO=0;
function update(dt){
  t+=dt;
  if(noseTimer>0)noseTimer-=dt;
  if(wiggle>0)wiggle-=dt;
  if(shake>0)shake-=dt;
  for(const c of clouds){
    c.x-=c.s*speed*.15*dt;
    if(c.x<-80){c.x=W+80;c.y=60+Math.random()*180;}
  }
  for(const p of particles){
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==="star"||p.type==="note")p.vy+=420*dt;
    if(p.type==="note"&&p.rot!==undefined)p.rot+=dt*2;
    if(p.type==="star"&&p.vr)p.rot+=p.vr*dt;
  }
  particles=particles.filter(p=>p.life>0);

  if(state!=="play")return;

  distance+=speed*dt*0.1; // 1 m ~ 100 px
  score+=speed*dt*0.1;
  const diff=Math.min(1,distance/2600);
  speed=340+diff*300;

  // player physics
  player.run+=dt*speed*.05;
  if(!player.onGround){
    player.vy+=1900*dt;player.y+=player.vy*dt;
    if(player.y>=GROUND){player.y=GROUND;player.vy=0;player.onGround=true;player.jumps=0;}
  }
  if(player.sliding){player.slideT-=dt;if(player.slideT<=0)player.sliding=false;}

  // spawn timers
  spawnTO-=dt;starTO-=dt;
  if(spawnTO<=0){
    spawnObstacle();
    spawnTO=(1.5-diff*.75)+Math.random()*.9;
  }
  if(starTO<=0){
    spawnStar();starTO=.9+Math.random()*1.6;
  }

  const move=speed*dt;
  for(const o of obstacles){
    o.x-=move;
    if(o.type==="button"&&o.rolling)o.rot+=move/o.r;
    if(o.type==="note")o.phase+=dt*3;
    if(!o.passed&&o.x+ (o.type==="button"?o.r:o.w) < player.x-player.w/2){
      o.passed=true;combo++;
      const bonus=5+Math.min(15,Math.floor((combo-1)/2)*2);
      score+=bonus;
      beep(660+Math.min(combo,10)*30,.08,"triangle",.06);
    }
    if(collide(o)){
      if(shield>0){
        shield--;o.passed=true;o.x=-999;combo=0;
        burstStars(player.x,player.y-50);
        shake=.35;beep(900,.3,"triangle",.12);
      }else{
        gameOver();return;
      }
    }
  }
  obstacles=obstacles.filter(o=>o.x>-120);

  for(const s of stars){
    s.x-=move;s.phase+=dt*4;
    if(!s.taken){
      const sx=player.x,sy=player.y-(player.sliding?25:55);
      if(Math.abs(s.x-sx)<s.r+24&&Math.abs(s.y-sy)<s.r+34){
        s.taken=true;score+=10;beap2();
        for(let i=0;i<8;i++)particles.push({type:"spark",x:s.x,y:s.y,
          vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.5,max:.5,c:PINK});
      }
    }
  }
  stars=stars.filter(s=>!s.taken&&s.x>-40);
}
function beap2(){beep(880,.08,"square",.07);setTimeout(()=>beep(1180,.1,"square",.07),70);}

function collide(o){
  const ph=player.sliding?34:78, py=player.y-(player.sliding?20:ph/2+8);
  const px=player.x,phw=player.sliding?34:24;
  if(o.type==="button"){
    return circleRect(o.x,o.y,o.r-4,px-phw,py-ph/2,phw*2,ph);
  }else{
    const oy=o.baseY+Math.sin(o.phase)*o.amp;
    return rectRect(px-phw,py-ph/2,phw*2,ph,o.x-o.w/2+6,oy-o.h/2+6,o.w-12,o.h-12);
  }
}
function circleRect(cx,cy,r,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny)<r*r;
}
function rectRect(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}

function gameOver(){
  state="over";player.dead=true;shake=.5;
  beep(180,.3,"sawtooth",.1);setTimeout(()=>beep(120,.5,"sawtooth",.1),150);
  const fs=Math.floor(score);
  if(fs>best){best=fs;localStorage.setItem("clownRunnerBest",String(best));}
}

// ---------- drawing ----------
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10*shake,(Math.random()-.5)*10*shake);
  drawSky();
  drawClouds();
  drawGround();
  for(const s of stars)drawStar(s.x,s.y,s.r,s.phase);
  for(const o of obstacles){
    if(o.type==="button")drawButton(o);else drawNote(o);
  }
  if(state==="play"||state==="over")drawPlayer();
  for(const p of particles)drawParticle(p);
  ctx.restore();

  if(state==="play")drawHUD();
  if(state==="intro")drawIntro();
  if(state==="over")drawOver();
}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,C.blue);g.addColorStop(1,C.cream);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GROUND);
  // sun
  ctx.fillStyle=C.yellow;ctx.strokeStyle=C.ink;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(680,90,40,0,6.283);ctx.fill();ctx.stroke();
}
function drawClouds(){
  ctx.fillStyle=C.cream;
  for(const c of clouds){
    ctx.beginPath();
    ctx.arc(c.x,c.y,20,0,6.283);
    ctx.arc(c.x+22,c.y+6,16,0,6.283);
    ctx.arc(c.x-22,c.y+6,15,0,6.283);
    ctx.fill();
  }
}
function drawGround(){
  ctx.fillStyle=C.green;ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.strokeStyle=C.ink;ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,GROUND);ctx.lineTo(W,GROUND);ctx.stroke();
  // moving stripes
  ctx.fillStyle=C.ink;
  const off=(distance*100)%60;
  for(let x=-off;x<W;x+=60){
    ctx.fillRect(x,GROUND+18,30,6);
  }
}

function drawPlayer(){
  const p=player;
  ctx.save();
  ctx.translate(p.x,p.y);
  if(p.sliding){
    ctx.translate(0,-6);
    ctx.rotate(-.12);
    ctx.scale(1.15,.7);
  }
  if(p.dead)ctx.rotate(.3);
  const bob=p.onGround&&!p.sliding?Math.sin(p.run)*3:0;
  // shadow
  ctx.fillStyle="rgba(26,22,24,.25)";
  ctx.beginPath();ctx.ellipse(0,2,30,7,0,0,6.283);ctx.fill();

  // sprite (doodle clown), proportional fit
  const iw=74,ih=104;
  if(spriteOK&&sprite.width){
    const ratio=sprite.width/sprite.height;
    let dw=iw,dh=dw/ratio;
    if(dh>ih){dh=ih;dw=dh*ratio;}
    // legs animated overlay behind sprite
    ctx.save();
    ctx.translate(0,bob);
    ctx.drawImage(sprite,-dw/2,-dh-2,dw,dh);
    ctx.restore();
  }else{
    // fallback clown drawn from palette
    drawFallbackClown(bob);
  }

  // rainbow wig accent (drawn around head top) with wobble on egg
  const wx=0,wy=-88+bob;
  const wob=wiggle>0?Math.sin(t*40)*.12:0;
  ctx.save();ctx.translate(wx,wy);ctx.rotate(wob);
  const cols=[C.red,C.orange,C.yellow,C.green,C.blue,C.purple];
  for(let i=0;i<6;i++){
    const a=-1.1+i*.44;
    ctx.fillStyle=cols[i];
    ctx.beginPath();
    ctx.arc(Math.cos(a)*20,Math.sin(a)*14-6,12,0,6.283);
    ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.stroke();
  }
  ctx.restore();

  // shield ring
  if(shield>0){
    ctx.strokeStyle=PINK;ctx.lineWidth=3;
    ctx.setLineDash([8,6]);ctx.lineDashOffset=-t*30;
    ctx.beginPath();ctx.ellipse(0,-46,42,58,0,0,6.283);ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawFallbackClown(bob){
  ctx.save();ctx.translate(0,bob);
  // body
  ctx.fillStyle=C.cream;ctx.strokeStyle=C.ink;ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-20,-58);ctx.lineTo(20,-58);ctx.lineTo(16,-12);ctx.lineTo(-16,-12);ctx.closePath();
  ctx.fill();ctx.stroke();
  // buttons
  ctx.fillStyle=C.red;
  ctx.beginPath();ctx.arc(0,-44,4,0,6.283);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(0,-30,4,0,6.283);ctx.fill();ctx.stroke();
  // legs
  const sw=player.onGround?Math.sin(player.run)*10:0;
  ctx.strokeStyle=C.ink;ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(-8,-12);ctx.lineTo(-8-sw,0);ctx.stroke();
  ctx.beginPath();ctx.moveTo(8,-12);ctx.lineTo(8+sw,0);ctx.stroke();
  // head
  ctx.fillStyle=C.cream;
  ctx.beginPath();ctx.arc(0,-74,20,0,6.283);ctx.fill();ctx.stroke();
  // eyes
  ctx.fillStyle=C.ink;
  ctx.beginPath();ctx.arc(-7,-78,2.4,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(7,-78,2.4,0,6.283);ctx.fill();
  // smile
  ctx.beginPath();ctx.arc(0,-72,8,.2,Math.PI-.2);ctx.stroke();
  // nose
  ctx.fillStyle=C.red;
  ctx.beginPath();ctx.arc(0,-70,5,0,6.283);ctx.fill();ctx.stroke();
  ctx.restore();
}

function drawButton(o){
  ctx.save();ctx.translate(o.x,o.y);
  ctx.fillStyle=C.red;ctx.strokeStyle=C.ink;ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(0,0,o.r,0,6.283);ctx.fill();ctx.stroke();
  ctx.save();ctx.rotate(o.rot);
  ctx.fillStyle=C.ink;
  ctx.beginPath();ctx.arc(-o.r*.28,-o.r*.18,3.5,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(o.r*.28,-o.r*.18,3.5,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(-o.r*.28,o.r*.18,3.5,0,6.283);ctx.fill();
  ctx.beginPath();ctx.arc(o.r*.28,o.r*.18,3.5,0,6.283);ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawNote(o){
  const y=o.baseY+Math.sin(o.phase)*o.amp;
  ctx.save();ctx.translate(o.x,y);
  ctx.fillStyle=PINK;ctx.strokeStyle=C.ink;ctx.lineWidth=3;
  // note head
  ctx.beginPath();ctx.ellipse(-10,14,11,8,-.3,0,6.283);ctx.fill();ctx.stroke();
  // stem
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-1,10);ctx.lineTo(-1,-18);ctx.stroke();
  // flag
  ctx.beginPath();ctx.moveTo(-1,-18);ctx.quadraticCurveTo(20,-12,16,4);
  ctx.quadraticCurveTo(8,-6,-1,-4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawStar(x,y,r,phase){
  ctx.save();ctx.translate(x,y+Math.sin(phase)*4);
  ctx.rotate(Math.sin(phase)*.2);
  ctx.fillStyle=PINK;ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2?r*.45:r,a=-Math.PI/2+i*Math.PI/5;
    ctx[i?"lineTo":"moveTo"](Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawParticle(p){
  const a=Math.max(0,p.life/p.max);
  ctx.save();ctx.globalAlpha=a;
  if(p.type==="dust"){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4*a,0,6.283);ctx.fill();}
  else if(p.type==="spark"){ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4);}
  else if(p.type==="star"){
    ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    const r=p.size;ctx.beginPath();
    for(let i=0;i<10;i++){const rr=i%2?r*.45:r,aa=i*Math.PI/5;
      ctx[i?"lineTo":"moveTo"](Math.cos(aa)*rr,Math.sin(aa)*rr);}
    ctx.fill();
  }else if(p.type==="note"){
    ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);
    ctx.fillStyle=p.c;ctx.strokeStyle=C.ink;ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(-6,8,7,5,-.3,0,6.283);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(0,-12);ctx.lineWidth=3;ctx.stroke();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawHUD(){
  ctx.fillStyle=C.ink;
  roundRect(16,16,210,64,12);ctx.fill();
  ctx.fillStyle=C.yellow;ctx.font="bold 22px Comic Sans MS";
  ctx.textAlign="left";ctx.textBaseline="middle";
  ctx.fillText("得分 "+Math.floor(score),32,40);
  ctx.fillStyle=C.cream;ctx.font="15px Comic Sans MS";
  ctx.fillText(Math.floor(distance)+" 米   最高 "+best,32,64);
  if(combo>1){
    ctx.fillStyle=C.red;ctx.font="bold 20px Comic Sans MS";
    ctx.fillText("连击 x"+combo,240,40);
  }
  if(shield>0){
    ctx.fillStyle=PINK;ctx.font="bold 16px Comic Sans MS";
    ctx.fillText("★护盾",240,68);
  }
  // touch hints
  ctx.fillStyle="rgba(26,22,24,.45)";ctx.font="13px Comic Sans MS";
  ctx.textAlign="right";
  ctx.fillText("上半屏/空格 跳跃 · 下半屏/↓ 滑铲",W-16,30);
}

function drawIntro(){
  ctx.fillStyle="rgba(240,236,227,.88)";ctx.fillRect(0,0,W,H);
  // title clown center
  ctx.save();ctx.translate(400,250);
  const wob=wiggle>0?Math.sin(t*40)*.08:0;
  ctx.rotate(wob);
  if(spriteOK&&sprite.width){
    const ratio=sprite.width/sprite.height;let dw=150,dh=dw/ratio;
    if(dh>190){dh=190;dw=dh*ratio;}
    ctx.drawImage(sprite,-dw/2,-dh-10,dw,dh);
  }else drawFallbackClown(0);
  // wig
  const cols=[C.red,C.orange,C.yellow,C.green,C.blue,C.purple];
  for(let i=0;i<6;i++){const a=-1.1+i*.44;
    ctx.fillStyle=cols[i];ctx.beginPath();
    ctx.arc(Math.cos(a)*40,Math.sin(a)*28-12,22,0,6.283);ctx.fill();
    ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.stroke();}
  // nose (clickable)
  ctx.fillStyle=C.red;ctx.strokeStyle=C.ink;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,2,20,0,6.283);ctx.fill();ctx.stroke();
  if(noseTimer>0){ctx.strokeStyle=PINK;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,2,26+noseTimer*10,0,6.283);ctx.stroke();}
  ctx.restore();

  // title
  ctx.textAlign="center";
  ctx.font="bold 56px Comic Sans MS";ctx.lineWidth=8;ctx.strokeStyle=C.ink;
  ctx.strokeText("彩虹小丑欢乐跑",400,100);
  const tcols=[C.red,C.orange,C.yellow,C.green,C.blue,C.purple];
  for(let i=0;i<7;i++){
    ctx.fillStyle=tcols[i%6];
    // per-char rainbow
  }
  // simpler: fill yellow then colored chars
  ctx.fillStyle=C.yellow;ctx.fillText("彩虹小丑欢乐跑",400,100);

  ctx.fillStyle=C.ink;ctx.font="17px Comic Sans MS";
  wrapText("顶着彩虹爆炸假发的开心小丑，总咧嘴笑着蹦跳，随身飘着音符与星星，走到哪都带着满溢的欢乐",400,360,640,24);

  // blinking start
  if(Math.floor(t*2)%2===0){
    ctx.fillStyle=C.red;ctx.font="bold 26px Comic Sans MS";
    ctx.fillText("按 空格 / 点击屏幕 开跑",400,470);
  }
  ctx.fillStyle=C.purple;ctx.font="15px Comic Sans MS";
  ctx.fillText("彩蛋：连点红鼻头 3 次可获得护盾！"+(egg?"  ✓ 已激活":""),400,520);

  // auto start after 1.5s
  if(t>1.5&&state==="intro"){state="play";newGame();}
}
function wrapText(text,x,y,maxW,lh){
  const chars=text.split("");let line="",yy=y;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  ctx.fillText(line,x,yy);
}

function drawOver(){
  ctx.fillStyle="rgba(26,22,24,.7)";ctx.fillRect(0,0,W,H);
  ctx.textAlign="center";
  ctx.fillStyle=C.yellow;ctx.font="bold 60px Comic Sans MS";
  ctx.strokeStyle=C.ink;ctx.lineWidth=8;
  ctx.strokeText("游戏结束",400,180);ctx.fillText("游戏结束",400,180);
  ctx.fillStyle=C.cream;ctx.font="28px Comic Sans MS";
  ctx.fillText("本局得分："+Math.floor(score),400,260);
  ctx.fillStyle=PINK;
  ctx.fillText("历史最高："+best,400,310);
  // button
  const bx=270,by=380,bw=260,bh=70;
  ctx.fillStyle=C.green;ctx.strokeStyle=C.ink;ctx.lineWidth=4;
  roundRect(bx,by,bw,bh,16);ctx.fill();ctx.stroke();
  ctx.fillStyle=C.ink;ctx.font="bold 30px Comic Sans MS";
  ctx.fillText("重新开始",400,by+38);
  ctx.fillStyle=C.cream;ctx.font="16px Comic Sans MS";
  ctx.fillText("点击按钮 或 按空格",400,490);
}

// ---------- loop ----------
function loop(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>.05)dt=.05;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.DOODLE_GAME={start,stop,getScore};
// intro begins immediately on load
state="intro";t=0;
player=resetPlayer();obstacles=[];stars=[];particles=[];clouds=[];
for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:60+Math.random()*180,s:.2+Math.random()*.5});
requestAnimationFrame(loop);
})();
</script>
